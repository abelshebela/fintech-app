name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run app test
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.abelshebela}}/fintech-app:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ${{ secrets.abelshebela }}/fintech-app:${{ github.sha }}

      - name: Push latest tag
        run: |
          docker tag ${{ secrets.abelshebela }}/fintech-app:${{ github.sha }} ${{ secrets.abelshebela }}/fintech-app:latest
          docker push ${{ secrets.abelshebela }}/fintech-app:latest
